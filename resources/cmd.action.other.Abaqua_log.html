<div class="cmd cmd-widget" data-type="action" data-subtype="other" data-cmd_id="#id#">
    
    <a class="btn btn-sm btn-default" style="cursor:pointer;" onclick="window.ouvrirLogAbaqua_#id#()">
        Log
    </a>

    <script>
        window.ouvrirLogAbaqua_#id# = function() {
            var version = 29;
            var cmdDiv = document.querySelector('.cmd[data-cmd_id="#id#"]');
            var logActif = '';
            var eqLogicId = '';

            if (cmdDiv) {
                var tuile = cmdDiv.closest('.eqLogic-widget, .eqLogic, [data-eqLogic_id], [data-eqlogic_id]');
                if (tuile) {
                    eqLogicId = tuile.getAttribute('data-eqLogic_id') || tuile.getAttribute('data-eqlogic_id') || '';
                }
            }

            function demanderNomLogManuel() {
                var nomDuLog = prompt("Impossible de récupérer automatiquement le log. Saisis le nom du fichier (ex: abaqua_maison_kyrnolia) :");
                if (!nomDuLog) {
                    return null;
                }
                return nomDuLog.trim();
            }

            function recupererNomLogDepuisBackend(onSuccess, onError) {
                if (!eqLogicId) {
                    onError('ID équipement introuvable');
                    return;
                }

                $.ajax({
                    url: 'plugins/abaqua/core/ajax/abaqua.ajax.php',
                    type: 'POST',
                    dataType: 'json',
                    data: {
                        action: 'getEquipmentLogName',
                        eqLogic_id: eqLogicId
                    },
                    success: function(response) {
                        if (response && response.state === 'ok' && response.result) {
                            onSuccess(String(response.result));
                            return;
                        }

                        if (typeof response === 'string' && response.trim() !== '') {
                            onSuccess(response.trim());
                            return;
                        }

                        onError('Réponse backend invalide');
                    },
                    error: function(xhr, status, error) {
                        onError(error || status || 'Erreur AJAX');
                    }
                });
            }

            function normaliserContenuLog(data) {
                var brut = data && data.result !== undefined ? data.result : data;
                var contenu = '';

                if (Array.isArray(brut)) {
                    contenu = brut.join('\n');
                } else if (typeof brut === 'object') {
                    contenu = JSON.stringify(brut, null, 2);
                } else {
                    contenu = String(brut || '');
                }

                return contenu.replace(/\\n/g, '\n').replace(/\\r/g, '');
            }

            function chargerLog(logName, successCallback, errorCallback) {
                $.ajax({
                    url: 'core/ajax/log.ajax.php',
                    type: 'POST',
                    dataType: 'json',
                    data: {
                        action: 'get',
                        logfile: logName,
                        log: logName
                    },
                    success: function(data) {
                        successCallback(data, normaliserContenuLog(data), logName);
                    },
                    error: errorCallback
                });
            }

            function ouvrirLog(logName) {
                logActif = logName;
                chargerLog(logActif, function(data, contenu, loadedLogName) {
                    afficherLog(contenu, loadedLogName);
                }, function(xhr, status, error) {
                    alert("Erreur AJAX : " + error);
                });
            }

            recupererNomLogDepuisBackend(function(logName) {
                ouvrirLog(logName);
            }, function() {
                var manuel = demanderNomLogManuel();
                if (!manuel) {
                    return;
                }
                ouvrirLog(manuel);
            });

            function afficherLog(contenuInitial, logName) {
                    logActif = logName;
                    var contenu = contenuInitial;

                    if (!contenu || contenu.trim() === '') {
                        contenu = 'Le log ' + logActif + ' est vide.';
                    }
                    
                    // --- FENÊTRE --- //
                    var fond = document.createElement('div');
                    fond.style.position = 'fixed';
                    fond.style.top = '0';
                    fond.style.left = '0';
                    fond.style.width = '100vw';
                    fond.style.height = '100vh';
                    fond.style.backgroundColor = 'rgba(0,0,0,0.4)'; 
                    fond.style.zIndex = '999999';
                    fond.style.display = 'flex';
                    fond.style.alignItems = 'center';
                    fond.style.justifyContent = 'center';
                    
                    var boite = document.createElement('div');
                    boite.style.backgroundColor = '#ffffff';
                    boite.style.width = '85%';
                    boite.style.height = '85%';
                    boite.style.padding = '20px';
                    boite.style.borderRadius = '8px';
                    boite.style.display = 'flex';
                    boite.style.flexDirection = 'column';
                    boite.style.boxShadow = '0 0 20px rgba(0,0,0,0.5)'; 
                    
                    var header = document.createElement('div');
                    header.style.display = 'flex';
                    header.style.justifyContent = 'space-between';
                    header.style.alignItems = 'center';
                    header.style.borderBottom = '1px solid #ccc';
                    header.style.paddingBottom = '10px';
                    header.style.marginBottom = '10px';
                    
                    var titre = document.createElement('h3');
                    titre.innerText = 'Log : ' + logActif + ' (Widget V' + version + ')';
                    titre.style.color = '#333333';
                    titre.style.margin = '0'; 
                    
                    var btnGroup = document.createElement('div');
                    
                    var btnVider = document.createElement('button');
                    btnVider.innerHTML = '<i class="fas fa-trash"></i> Vider';
                    btnVider.className = 'btn btn-danger btn-sm'; 
                    btnVider.style.cursor = 'pointer';
                    btnVider.style.marginRight = '10px'; 
                    
                    var btnFermer = document.createElement('button');
                    btnFermer.innerText = 'Fermer';
                    btnFermer.className = 'btn btn-default btn-sm';
                    btnFermer.style.cursor = 'pointer';
                    
                    btnGroup.appendChild(btnVider);
                    btnGroup.appendChild(btnFermer);
                    header.appendChild(titre);
                    header.appendChild(btnGroup);
                    
                    var texte = document.createElement('pre');
                    texte.innerText = contenu;
                    texte.style.flex = '1';
                    texte.style.overflow = 'auto';
                    texte.style.backgroundColor = '#f9f9f9';
                    texte.style.color = '#000000';
                    texte.style.border = '1px solid #ddd';
                    texte.style.padding = '10px';
                    texte.style.borderRadius = '4px';
                    texte.style.whiteSpace = 'pre-wrap';
                    texte.style.wordBreak = 'break-all';
                    
                    // --- TEMPS RÉEL --- //
                    var intervalId = setInterval(function() {
                        if (!document.body.contains(fond)) {
                            clearInterval(intervalId);
                            return;
                        }

                        $.ajax({
                            url: 'core/ajax/log.ajax.php',
                            type: 'POST',
                            dataType: 'json',
                            data: { action: 'get', logfile: logActif, log: logActif },
                            success: function(updateData) {
                                if (updateData.state === 'error') return;

                                var newContenu = normaliserContenuLog(updateData);
                                
                                if (!newContenu || newContenu.trim() === '') {
                                    newContenu = 'Le log ' + logActif + ' est vide.';
                                }
                                
                                if (texte.innerText !== newContenu) {
                                    var positionActuelle = texte.scrollTop;
                                    texte.innerText = newContenu;
                                    texte.scrollTop = positionActuelle;
                                }
                            }
                        });
                    }, 3000);

                    // --- ACTIONS DES BOUTONS --- //
                    btnVider.onclick = function() {
                        if (confirm("Es-tu sûr de vouloir vider ce log ?")) {
                            $.ajax({
                                url: 'core/ajax/log.ajax.php',
                                type: 'POST',
                                dataType: 'json',
                                data: { action: 'remove', log: logActif }, 
                                success: function(response) {
                                    if (response && response.state === 'error') {
                                        alert("Erreur : " + (response.result || JSON.stringify(response)));
                                    } else {
                                        texte.innerText = 'Le log ' + logActif + ' est vide.';
                                    }
                                }
                            });
                        }
                    };

                    btnFermer.onclick = function() {
                        clearInterval(intervalId);
                        document.body.removeChild(fond);
                    };
                    
                    boite.appendChild(header);
                    boite.appendChild(texte);
                    fond.appendChild(boite);
                    document.body.appendChild(fond);

                    texte.scrollTop = 0;
                }
        };
    </script>
</div>
